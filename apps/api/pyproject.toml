[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llc-api"
version = "0.4.0"
description = "Local-first language learning API for Laboratory Language Companion"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]
cloud = ["google-genai>=2,<3", "pypdf>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/llc_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
